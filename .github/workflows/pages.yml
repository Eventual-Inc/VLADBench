# Publish the results companion as a static site at https://eventual-inc.github.io/VLADBench/
# Enable once in the repository: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "results.html"
      - "self-test.html"
      - "web/**"
      - "answers/**"
      - "task-review-*.js"
      - "results/dataset/*.png"
      - "src/vladbench/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the standalone site
        run: uv run vladbench build --steps site --site dist/pages --article https://www.eventual.ai/blog/vladbench-reeval
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
