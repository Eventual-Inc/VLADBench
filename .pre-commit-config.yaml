# Install once with: uvx pre-commit install --hook-type pre-commit --hook-type pre-push
# Fast checks run on every commit; the test suite runs before a push.
# original/ is the paper's released code, kept byte for byte with hashes.
exclude: ^original/
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        pass_filenames: false
      - id: site-scripts
        name: site scripts parse
        entry: sh -c 'for f in "$@"; do node --check "$f" || exit 1; done' --
        language: system
        files: ^web/.*\.js$
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
